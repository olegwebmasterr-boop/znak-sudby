name: VK daily post
on:
  schedule:
    - cron: '0 16 * * *'   # 19:00 МСК — вечерний уникальный пост сообщества
  workflow_dispatch:        # ручной запуск: тест и «выпусти пост на тему X»
    inputs:
      text:
        description: 'Текст поста (пусто = пост из очереди). Ссылка на сайт добавится сама.'
        required: false
        default: ''
        type: string
permissions: {}
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish VK post
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_CUSTOM_TEXT: ${{ github.event.inputs.text }}
        run: python3 bot/vk_post.py post
